<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución del Dólar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 95%;
            max-width: 1200px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .chart-wrapper {
            position: relative;
            height: 500px;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .stat {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Evolución del Dólar (Marzo 2022 - Agosto 2024)</h1>
        <div class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
        <div class="info">
            <div class="stat">
                <div class="stat-label">Valor Inicial</div>
                <div class="stat-value">$201.50</div>
            </div>
            <div class="stat">
                <div class="stat-label">Valor Final</div>
                <div class="stat-value">$1,383.86</div>
            </div>
            <div class="stat">
                <div class="stat-label">Incremento</div>
                <div class="stat-value">$1,182.36 (587%)</div>
            </div>
            <div class="stat">
                <div class="stat-label">Máximo Registrado</div>
                <div class="stat-value">$1,500.00</div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('myChart').getContext('2d');
        const data = {
            labels: ['2022-03', '2022-04', '2022-05', '2022-06', '2022-07', '2022-08', '2022-09', '2022-10', '2022-11', '2022-12', 
                      '2023-01', '2023-02', '2023-03', '2023-04', '2023-05', '2023-06', '2023-07', '2023-08', '2023-09', '2023-10',
                      '2023-11', '2023-12', '2024-01', '2024-02', '2024-03', '2024-04', '2024-05', '2024-06', '2024-07', '2024-08'],
            datasets: [
                {
                    label: 'Promedio Mensual',
                    data: [201.50, 198.84, 204.20, 214.22, 282.36, 293.17, 280.16, 286.27, 298.82, 325.11,
                           367.88, 377.90, 381.82, 419.11, 480.95, 490.20, 517.03, 666.88, 737.44, 916.58,
                           943.27, 974.18, 1153.73, 1122.05, 1017.98, 1017.02, 1093.41, 1276.47, 1436.38, 1383.86],
                    borderColor: '#667eea',
                    backgroundColor: 'rgba(102, 126, 234, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: '#667eea',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointHoverRadius: 7
                },
                {
                    label: 'Máximo Mensual',
                    data: [203, 212.5, 208, 239, 350, 298, 291, 293, 321, 359,
                           387, 383, 397, 497, 494, 496, 553, 790, 805, 990,
                           995, 995, 1260, 1195, 1050, 1055, 1300, 1380, 1500, 1400],
                    borderColor: '#ff6b6b',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 3,
                    pointBackgroundColor: '#ff6b6b',
                    fill: false,
                    tension: 0.4
                },
                {
                    label: 'Mínimo Mensual',
                    data: [199.6, 195, 200.5, 204, 238, 280, 269, 276, 286, 310,
                           342, 373, 369, 390, 467, 483, 491, 550, 705, 798,
                           880, 905, 1005, 1030, 980, 980, 1035, 1225, 1395, 1365],
                    borderColor: '#51cf66',
                    backgroundColor: 'transparent',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    pointRadius: 3,
                    pointBackgroundColor: '#51cf66',
                    fill: false,
                    tension: 0.4
                }
            ]
        };

        const chart = new Chart(ctx, {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: {
                                size: 12
                            },
                            padding: 15
                        }
                    },
                    title: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: 'Valor del Dólar ($)'
                        },
                        grid: {
                            drawBorder: true,
                            color: 'rgba(0, 0, 0, 0.1)'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: 'Mes'
                        },
                        grid: {
                            display: false
                        }
                    }
                },
                interaction: {
                    intersect: false,
                    mode: 'index'
                }
            }
        });
    </script>
</body>
</html>
